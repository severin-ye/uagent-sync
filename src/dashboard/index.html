<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Uagent Sync 配置看板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Uagent Sync 首页"><span class="brand-mark">U</span><span class="brand-name">uagent</span><span class="brand-chip">SYNC</span></a>
      <div class="workspace-picker"><span class="icon">⌑</span><span class="workspace-name">正在扫描…</span><span class="chevron">⌄</span></div>
      <p class="nav-label">工作区</p>
      <nav aria-label="主导航">
        <a class="nav-item active" href="#overview"><span>◫</span><strong>总览</strong></a>
        <a class="nav-item" href="#agents"><span>⌘</span><strong>Agent 配置</strong><em id="agent-count">3</em></a>
        <a class="nav-item" href="#matrix"><span>≠</span><strong>差异</strong><em id="diff-count">—</em></a>
        <a class="nav-item" href="#actions"><span>↥</span><strong>迁移建议</strong></a>
        <a class="nav-item" href="#security"><span>◇</span><strong>安全边界</strong></a>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题">◐ <span>切换主题</span></button>
      </div>
    </aside>

    <main id="overview">
      <header class="topbar">
        <div class="breadcrumb">工作区 / <span id="workspace-short">配置总览</span></div>
        <div class="top-actions"><span id="scan-status" class="scan-status" role="status">正在读取配置</span><button id="refresh" class="button" type="button">重新扫描</button><button class="button primary" type="button" disabled title="第一阶段为只读模式">创建快照</button></div>
      </header>

      <section class="hero">
        <p class="eyebrow">AGENT CONFIGURATION CONSOLE</p>
        <h1>三个 Agent，一套清楚的配置。</h1>
        <p>识别公共能力、平台差异和迁移缺口。配置扫描只读，密钥值不会进入页面或 API。</p>
      </section>

      <section id="agents" class="agent-grid" aria-label="Agent 状态"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></section>

      <section class="content-grid">
        <article id="matrix" class="panel">
          <header class="panel-head"><div><p class="kicker">COVERAGE</p><h2>配置覆盖</h2></div><span class="quiet">实时扫描</span></header>
          <div id="matrix-content" class="matrix" aria-live="polite"></div>
        </article>
        <article id="actions" class="panel">
          <header class="panel-head"><div><p class="kicker">NEXT ACTIONS</p><h2>下一步</h2></div><span id="action-count" class="quiet">—</span></header>
          <div id="action-list" class="action-list"></div>
        </article>
      </section>

      <section id="security" class="security-strip"><span class="security-icon">◇</span><div><strong>只读模式</strong><p>不迁移 Session、Memory、Provider 凭据、权限、主题或 UI 状态。DeepSeek MCP 在获得本机证据前标记为“未证实”。</p></div><span id="last-scan" class="last-scan">尚未扫描</span></section>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
